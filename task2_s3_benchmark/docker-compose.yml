services:
  # Upstream minio/minio & minio/mc were removed from Docker Hub; use pgsty drop-in multi-arch mirrors.
  minio:
    image: pgsty/minio:latest
    container_name: task2-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mc:
    image: pgsty/mc:latest
    container_name: task2-mc-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin123; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing local/benchmark
        mc ls local

  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    platform: linux/amd64
    container_name: task2-bench
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    depends_on:
      mc:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: benchmark
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3FS_MOUNT: /mnt/s3fs
      GOOFYS_MOUNT: /mnt/goofys
    volumes:
      - ./results:/app/results

volumes:
  minio_data:
